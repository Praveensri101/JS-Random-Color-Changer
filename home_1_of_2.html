
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration | Lead To Learning</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background: #172554;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
    }

    .registration-card {
      max-width: 550px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .registration-card h2 {
      color: #172554;
      font-weight: bold;
    }

    .form-label {
      font-weight: 600;
    }

    .course-option {
      padding: 12px;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .btn-register {
      background: #172554;
      color: white;
      width: 100%;
      padding: 12px;
      font-weight: bold;
    }

    .btn-register:hover {
      background: #263d80;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        Lead To Learning
      </a>
    </div>
  </nav>

  <!-- Registration Form -->
  <div class="container">

    <div class="registration-card">

      <h2 class="text-center mb-4">Course Registration</h2>

      <form id="registrationForm">

        <!-- Full Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            placeholder="Enter your full name"
            minlength="2"
            maxlength="80"
            required
          >
        </div>

        <!-- Phone -->
        <div class="mb-3">
          <label for="phone" class="form-label">Phone</label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            pattern="[0-9+ ]{10,15}"
            minlength="10"
            maxlength="15"
            required
          >
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="Enter your email address"
            maxlength="120"
            required
          >
        </div>

        <!-- Course Radio Buttons -->
        <div class="mb-4">

          <label class="form-label d-block">
            Select Course
          </label>

          <div class="course-option">
            <input
              class="form-check-input"
              type="radio"
              name="course"
              id="bootstrap"
              value="Bootstrap"
              required
            >
            <label class="form-check-label ms-2" for="bootstrap">
              Bootstrap
            </label>
          </div>

          <div class="course-option">
            <input
              class="form-check-input"
              type="radio"
              name="course"
              id="dataAnalyst"
              value="Data Analyst"
            >
            <label class="form-check-label ms-2" for="dataAnalyst">
              Data Analyst
            </label>
          </div>

          <div class="course-option">
            <input
              class="form-check-input"
              type="radio"
              name="course"
              id="frontend"
              value="Frontend Development"
            >
            <label class="form-check-label ms-2" for="frontend">
              Frontend Development
            </label>
          </div>

<div class="course-option">
  <input class="form-check-input" type="radio" name="course"
    id="python-programming" value="Python Programming">
  <label class="form-check-label ms-2" for="python-programming">
    Python Programming
  </label>
</div>

<div class="course-option">
  <input class="form-check-input" type="radio" name="course"
    id="java-programming" value="Java Programming">
  <label class="form-check-label ms-2" for="java-programming">
    Java Programming
  </label>
</div>

<div class="course-option">
  <input class="form-check-input" type="radio" name="course"
    id="sql-database" value="SQL & Database">
  <label class="form-check-label ms-2" for="sql-database">
    SQL & Database
  </label>

        </div>

        <!-- Error Message -->
        <div
          id="errorMessage"
          class="alert alert-danger d-none"
          role="alert"
        ></div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitButton"
          class="btn btn-register"
        >
          Submit Registration
        </button>

      </form>
    </div>
  </div>

  <!-- Success Modal -->
  <div
    class="modal fade"
    id="successModal"
    tabindex="-1"
    aria-labelledby="successModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="successModalLabel">
            Registration Successful!
          </h5>

          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body text-center">
          <h4>Thank you for registering!</h4>
          <p id="successDetails" class="mb-0"></p>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-success"
            data-bs-dismiss="modal"
          >
            Close
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>

  <!-- Firebase and Form Submission -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      
import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =====================================
    // 1. PASTE YOUR FIREBASE CONFIGURATION
    // =====================================

    const firebaseConfig = {
  apiKey: "AIzaSyA6aTXFR8RoC7_W1kA-QvNuV7xL0TCkm2k",
    authDomain: "lead-to-learn.firebaseapp.com",
    projectId: "lead-to-learn",
    storageBucket: "lead-to-learn.firebasestorage.app",
    messagingSenderId: "538809114840",
    appId: "1:538809114840:web:b51e5a5d55ab71fae337ad",
    measurementId: "G-78QGNCN9J3"
    };


    // =====================================
    // 2. INITIALIZE FIREBASE
    // =====================================

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // =====================================
    // 3. GET FORM ELEMENTS
    // =====================================

    const registrationForm =
      document.getElementById("registrationForm");

    const submitButton =
      document.getElementById("submitButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const successModalElement =
      document.getElementById("successModal");

    const successModal =
      new bootstrap.Modal(successModalElement);


    // =====================================
    // 4. FORM SUBMISSION
    // =====================================

    registrationForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      errorMessage.classList.add("d-none");
      errorMessage.textContent = "";

      // Get form values
      const name = document.getElementById("name").value.trim();

      const phone = document.getElementById("phone").value.trim();

      const email = document.getElementById("email").value.trim();

      // Get selected radio button value
      const selectedCourse =
        document.querySelector('input[name="course"]:checked');

      if (!selectedCourse) {
        errorMessage.textContent = "Please select a course.";
        errorMessage.classList.remove("d-none");
        return;
      }

      const course = selectedCourse.value;

      // Prevent multiple submissions
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      try {

        // Save registration in Firestore
       const documentId = name.trim().replace(/\s+/g, "_");

await setDoc(doc(db, "course_registrations", documentId), {
  name: name,
  phone: phone,
  email: email,
  course: course,
  registeredAt: serverTimestamp()
});

        // Display success message
        document.getElementById("successDetails").textContent =
          `${name}, your registration for ${course} has been received.`;

        // Reset form
        registrationForm.reset();

        // Show success modal
        successModal.show();

      } catch (error) {

        console.error("Firebase registration error:", error);

        errorMessage.textContent =
          "Registration failed. Please try again. Error: " +
          error.code;

        errorMessage.classList.remove("d-none");

      } finally {

        submitButton.disabled = false;
        submitButton.textContent = "Submit Registration";

      }

    });

  </script>

</body>
</html>
